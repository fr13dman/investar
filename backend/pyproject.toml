[project]
name = "investar-backend"
version = "0.1.0"
description = "Investar: S&P 500 / Nasdaq-100 screener and company research API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pandas>=3.1.1",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
    "vadersentiment>=3.3.2",
    "yfinance>=1.8.0",
]

[project.optional-dependencies]
sentiment = [
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[project.scripts]
investar = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
